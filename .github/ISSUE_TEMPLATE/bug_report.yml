name: Bug 反馈
description: 报告一个可以复现的问题（请先阅读隐私提醒）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **不要提交任何账号、密钥或 Token。**
        > 请删除日志中的小米 ID、PassToken、API Key、Cookie、家庭 IP 与私有域名，否则 Issue 会被关闭。
  - type: input
    id: version
    attributes:
      label: mi-paiai 版本
      description: 例如 v0.9.1 或镜像 tag
      placeholder: v0.9.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - Linux 服务器 (amd64)
        - ARM64 NAS / 树莓派
        - ARMv7 设备
        - Docker Desktop
        - 直接运行 Node.js
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志
      description: 请确认已删除所有密钥与个人信息
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不含任何密钥、Token、账号或私有网络信息
          required: true